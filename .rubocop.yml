AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - "test/dummy/**/*"
    - "vendor/**/*"
    - "bin/**/*"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/ArgumentsForwarding:
  Enabled: false

Layout/LineLength:
  Max: 140
  Exclude:
    - "test/**/*"

Metrics/ClassLength:
  Exclude:
    - "test/**/*"
    - "lib/recording_studio_library/engine.rb"
    - "lib/recording_studio_library/configuration.rb"
    - "lib/recording_studio_library/adapters/**/*"
    - "app/controllers/recording_studio_library/application_controller.rb"
    - "app/controllers/recording_studio_library/placements_controller.rb"

Metrics/MethodLength:
  Exclude:
    - "test/**/*"
    - "lib/generators/**/*"
    - "app/controllers/**/*"
    - "app/helpers/**/*"
    - "app/services/**/*"
    - "app/models/**/*"
    - "lib/recording_studio_library.rb"
    - "lib/recording_studio_library/engine.rb"
    - "lib/recording_studio_library/configuration.rb"
    - "lib/recording_studio_library/adapters/**/*"
    - "lib/recording_studio_library/authorization.rb"

Metrics/AbcSize:
  Exclude:
    - "test/**/*"
    - "lib/generators/**/*"
    - "app/controllers/**/*"
    - "app/services/**/*"
    - "lib/recording_studio_library/engine.rb"
    - "lib/recording_studio_library/configuration.rb"
    - "lib/recording_studio_library/authorization.rb"
    - "lib/recording_studio_library/adapters/**/*"

Metrics/ModuleLength:
  Exclude:
    - "app/services/**/*"
    - "lib/recording_studio_library.rb"

Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "lib/recording_studio_library/engine.rb"

Metrics/ParameterLists:
  Exclude:
    - "app/services/**/*"
    - "lib/recording_studio_library.rb"

Metrics/CyclomaticComplexity:
  Exclude:
    - "test/**/*"
    - "app/services/**/*"
    - "lib/recording_studio_library/authorization.rb"

Metrics/PerceivedComplexity:
  Exclude:
    - "test/**/*"
    - "app/services/**/*"
    - "lib/recording_studio_library/authorization.rb"

Lint/EmptyBlock:
  Exclude:
    - "test/**/*"

Lint/NestedMethodDefinition:
  Exclude:
    - "test/**/*"

Naming/VariableNumber:
  Exclude:
    - "test/**/*"

Lint/MissingSuper:
  Exclude:
    - "app/services/**/*"
    - "test/services/**/*"
